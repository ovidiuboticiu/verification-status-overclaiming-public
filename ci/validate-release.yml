name: Public release integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove bootstrap workflow-run history
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "vso-public-release-cleanup",
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?per_page=100",
              headers=headers,
          )
          with urllib.request.urlopen(req) as response:
              runs = json.load(response)["workflow_runs"]
          deleted = []
          for run in runs:
              if run.get("name") != "Bootstrap clean public history":
                  continue
              if run.get("status") != "completed":
                  continue
              rid = run["id"]
              dreq = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{rid}",
                  headers=headers,
                  method="DELETE",
              )
              try:
                  with urllib.request.urlopen(dreq) as response:
                      if response.status != 204:
                          raise RuntimeError(response.status)
                  deleted.append(rid)
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise
          print("Deleted bootstrap runs:", deleted)
          PY

      - name: Validate release hashes, ZIPs, syntax, and privacy
        run: python tools/validate_release.py

      - name: Recompute E3-A from raw traces
        run: python tools/recalculate_e3a.py

      - name: Run F3 semantic sensitivity diagnostic
        run: python tools/diagnose_f3_semantics.py

      - name: Run exact frozen offline tests
        shell: bash
        run: |
          rm -rf release_tmp
          mkdir -p release_tmp/frozen
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile(
              "artifacts/VSO_E3_v0.7r2_EXACT_CANDIDATE.zip", "r"
          ) as zf:
              assert zf.testzip() is None
              zf.extractall("release_tmp/frozen")
          PY
          cd release_tmp/frozen
          python e3/implementation_v0_7/test_exact_package_r2.py
          python e3/implementation_v0_7/prove_f4_history_prefix_neutrality.py
          python e3/implementation_v0_7/test_frozen_manifests_r2.py
          python e3/implementation_v0_7/test_r2_repair.py
          python e3/implementation_v0_7/test_live_response_adapter.py
          python e3/implementation_v0_7/test_live_runner_r2.py
          python e3/implementation_v0_7/test_attempt_registry_r2.py
          python e3/implementation_v0_7/test_runner_policy_r2.py
          python e3/implementation_v0_7/test_official_runner_prepare_r2.py

      - name: Remove temporary release-built branch
        if: github.event_name == 'push' && github.ref_name == 'main' && success()
        shell: bash
        run: git push origin --delete release-built || true
